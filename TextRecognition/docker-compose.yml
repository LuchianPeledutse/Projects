version: "3.8"

services:
  postgres:
    image: postgres:15
    restart: always
    env_file:
      - .env
    networks:
      - main_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U $DB_USER -d $DB_NAME'"]
      interval: 5s
      retries: 5

  model:
    build: ./inference
    networks:
      - main_network
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgresdb:
    build: ./db_
    networks:
      - main_network
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    networks:
      - main_network
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      model:
        condition: service_started
      postgresdb:
        condition: service_started

volumes:
  postgres_data:

networks:
  main_network:
    driver: bridge