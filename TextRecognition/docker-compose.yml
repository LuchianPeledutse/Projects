version: "3.8"

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  model:
    build: ./model_inference
    container_name: model_service
    environment:
      MODEL_WEIGHTS_PATH: ${MODEL_WEIGHTS_PATH}
      TOKENIZER_PATH: ${TOKENIZER_PATH}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  dbsaver:
    build: ./db_saver
    container_name: db_saver
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: frontend_app
    environment:
      MODEL_SERVICE_URL: http://model:8000
      DBSAVER_SERVICE_URL: http://dbsaver:8080
    ports:
      - "8501:8501"
    depends_on:
      - model
      - dbsaver

volumes:
  postgres_data: